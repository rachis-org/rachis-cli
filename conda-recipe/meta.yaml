package:
  name: q2cli
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
  entry_points:
  - qiime=q2cli.__main__:qiime
requirements:
  host:
  - python  {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - python  {{ python }}
  - setuptools
  - click >=8.1
  - qiime2 {{ qiime2_epoch }}.*
  build:
  - python {{ python }}
  - setuptools
  - versioningit
test:
  requires:
  - qiime2 >={{ qiime2 }}
  - pytest
  - pytest-xdist
  - q2-mystery-stew
  imports:
  - q2cli
  commands:
  - QIIMETEST= qiime --help
  - QIIMETEST= py.test --pyargs q2cli
about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
